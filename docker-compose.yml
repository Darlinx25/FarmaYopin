services:
  app:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=farmayopin
      - DB_PASSWORD=farmayopin
      - DB_NAME=farmayopin
      - JWT_SECRET=cambiar_en_produccion
      - PORT=8080
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: mysql:8.0
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=farmayopin
      - MYSQL_USER=farmayopin
      - MYSQL_PASSWORD=farmayopin
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

volumes:
  mysql_data:
